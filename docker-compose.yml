services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_config
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart
    ports:
      - "5433:5432"
    volumes:
      - smart_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  smart_postgres:
