name: release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf wget squashfs-tools
      - name: Build AppImage
        working-directory: tauri-app
        run: |
          npm ci
          npm run tauri build
      - name: Fix AppImage (remove bundled system libs)
        working-directory: tauri-app
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          echo "Fixing: $APPIMAGE"

          # Извлекаем через unsquashfs (не требует FUSE)
          unsquashfs -d squashfs-root "$APPIMAGE"

          # Удаляем конфликтующие либы
          for lib in \
            libwebkit2gtk-4.1.so.0 \
            libEGL.so.1 \
            libEGL_mesa.so.0 \
            libGL.so.1 \
            libGLdispatch.so.0 \
            libGLX.so.0 \
            libGLX_mesa.so.0 \
            libGLESv2.so.2 \
            libgbm.so.1; do
            if [ -f "squashfs-root/usr/lib/$lib" ]; then
              echo "Removing bundled: $lib"
              rm "squashfs-root/usr/lib/$lib"
            fi
          done

          # Скачиваем appimagetool и пересобираем
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool squashfs-root "$APPIMAGE" 2>/dev/null

          rm -rf squashfs-root appimagetool
          echo "Done: $APPIMAGE"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            tauri-app/src-tauri/target/release/bundle/appimage/*.AppImage
            tauri-app/src-tauri/target/release/bundle/deb/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Build installer
        working-directory: tauri-app
        run: |
          npm ci
          npm run tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            tauri-app/src-tauri/target/release/bundle/msi/*.msi
            tauri-app/src-tauri/target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux
      - windows
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: release-assets/linux
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-bundles
          path: release-assets/windows
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/linux/**/*
            release-assets/windows/**/*
