name: release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - name: Cache tauri helpers, npm and cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tauri/binary-releases
            ~/.npm
            ~/.cargo/registry
          key: ${{ runner.os }}-tauri-${{ hashFiles('**/package-lock.json') }}

      - name: Install system deps
        run: |
          pacman-key --init || true
          pacman-key --populate archlinux || true
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git curl wget base-devel \
            webkit2gtk-4.1 libappindicator-gtk3 librsvg patchelf \
            nodejs npm \
            squashfs-tools fuse2
      - name: Ensure tauri helper binaries (linuxdeploy/AppRun)
        run: |
          set -e
          mkdir -p $HOME/.cache/tauri/binary-releases
          cd $HOME/.cache/tauri/binary-releases
          # helper to retry downloads
          fetch() {
            url="$1"; out="$2"; tries=0
            until [ $tries -ge 5 ]
            do
              if curl -fSL "$url" -o "$out"; then
                chmod +x "$out" || true
                return 0
              fi
              tries=$((tries+1))
              echo "Retry $tries for $url"
              sleep 3
            done
            echo "Failed to download $url" >&2
            return 1
          }
          fetch https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64 AppRun-x86_64 || true
          fetch https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage linuxdeploy-x86_64.AppImage || true
          fetch https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh linuxdeploy-plugin-gtk.sh || true
          fetch https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh linuxdeploy-plugin-gstreamer.sh || true
          fetch https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage || true
      - name: Verify tauri helper binaries
        run: |
          set -euo pipefail
          ls -l $HOME/.cache/tauri/binary-releases || true
          cd $HOME/.cache/tauri/binary-releases
          for f in AppRun-x86_64 linuxdeploy-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage linuxdeploy-plugin-gtk.sh linuxdeploy-plugin-gstreamer.sh; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              chmod +x "$f" || true
              # Try to run version/help to catch missing libs
              if [[ "$f" == *.AppImage || "$f" == AppRun-* ]]; then
                # If FUSE is not available (container), extract AppImage and wrap extracted AppRun
                if [ ! -e /dev/fuse ]; then
                  echo "FUSE not available; extracting $f"
                  ./$f --appimage-extract >/dev/null 2>&1 || true
                  if [ -f squashfs-root/AppRun ]; then
                    mv squashfs-root "${f}.extracted" || true
                    # create wrapper script at original filename to execute extracted AppRun
                    printf '%s\n' '#!/bin/sh' "DIR=\"\$(cd \"\$(dirname \"\$0\")\" && pwd)/${f}.extracted\"" 'exec "$DIR/AppRun" "$@"' > "$f"
                    chmod +x "$f" || true
                    echo "Created wrapper for $f -> ${f}.extracted/AppRun"
                  else
                    echo "Extraction failed or AppRun not found for $f"
                  fi
                else
                  ./$f --version || ./$f --help || true
                fi
              else
                head -n 5 "$f" || true
              fi
            else
              echo "Missing $f"
            fi
          done
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: actions/checkout@v4
      - name: Build AppImage
        working-directory: tauri-app
        run: |
          source "$HOME/.cargo/env"
          npm ci
          # capture full build output for diagnosis
          npm run tauri build 2>&1 | tee tauri-build.log || true
      - name: Inspect AppImage
        working-directory: tauri-app
        run: |
          set -e
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n1 || true)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found, skipping inspect"
            exit 0
          fi
          echo "Found $APPIMAGE"
          # extract and ldd WebKitWebProcess for diagnosis
          $APPIMAGE --appimage-extract >/dev/null 2>&1 || true
          mkdir -p appimage-inspect
          if [ -f squashfs-root/usr/libexec/webkit2gtk-4.1/WebKitWebProcess ]; then
            ldd squashfs-root/usr/libexec/webkit2gtk-4.1/WebKitWebProcess > appimage-inspect/webkit-ldd.txt || true
          else
            echo "WebKitWebProcess not found at expected path" > appimage-inspect/webkit-ldd.txt
          fi
          tar -czf appimage-inspect.tar.gz appimage-inspect || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            tauri-app/src-tauri/target/release/bundle/appimage/*.AppImage
            tauri-app/src-tauri/target/release/bundle/deb/*.deb
              tauri-app/appimage-inspect.tar.gz
              tauri-app/tauri-build.log

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Build installer
        working-directory: tauri-app
        run: |
          npm ci
          npm run tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            tauri-app/src-tauri/target/release/bundle/msi/*.msi
            tauri-app/src-tauri/target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux
      - windows
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: release-assets/linux
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-bundles
          path: release-assets/windows
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/linux/**/*
            release-assets/windows/**/*
