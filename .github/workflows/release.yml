name: release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux-deb:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: tauri-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config delete proxy || true
          npm config delete https-proxy || true
          npm config list

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json
          registry-url: https://registry.npmjs.org/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --fetch-timeout=300000 --fetch-retries=5

      - name: Build frontend
        run: npm run build

      - name: TypeScript check
        run: npx --no-install tsc --noEmit

      - name: Build DEB
        run: npm run build:deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: tauri-app/src-tauri/target/release/bundle/deb/*.deb

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-deb
    runs-on: ubuntu-22.04

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: release-assets/linux

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/linux/**/*.deb

